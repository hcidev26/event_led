<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập quản trị</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --line:#e3e5e8; --text:#1c1f23; --muted:#6b7280; --accent:#2563eb; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --panel:#1a1d22; --line:#2b2f36; --text:#e8eaed; --muted:#9aa1ab; --accent:#60a5fa; --danger:#f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  input { width: 100%; font: inherit; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); margin-bottom: 14px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { width: 100%; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--danger); min-height: 20px; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<form id="f">
  <h1>Quản trị màn hình LED</h1>
  <p>Đăng nhập để cấu hình</p>
  <label for="user">Tên đăng nhập</label>
  <input id="user" autocomplete="username" required autofocus>
  <label for="pass">Mật khẩu</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button id="btn" type="submit">Đăng nhập</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const $ = (id) => document.getElementById(id);
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('btn').disabled = true; $('err').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: $('user').value, pass: $('pass').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Đăng nhập thất bại');
    location.href = '/admin';
  } catch (err) { $('err').textContent = err.message; $('pass').select(); }
  finally { $('btn').disabled = false; }
});
</script>
</body>
</html>
