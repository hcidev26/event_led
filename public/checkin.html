<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Check-in</title>
<link id="fontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
  :root { --accent: #ffd166; --font: 'Be Vietnam Pro'; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: var(--font), system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f8fafc;
    background: radial-gradient(circle at 20% 0%, #1e3a5f 0%, transparent 60%), radial-gradient(circle at 100% 100%, #3b1f4f 0%, transparent 55%), #0f172a; }
  .card { width: 100%; max-width: 420px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 28px 22px; backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .tag { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 10px; }
  h1 { font-size: 26px; margin: 0 0 8px; line-height: 1.2; }
  p.sub { margin: 0 0 22px; color: #cbd5e1; font-size: 15px; line-height: 1.5; }
  input { width: 100%; font: inherit; font-size: 18px; padding: 15px 16px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.25); color: #fff; outline: none; transition: border-color .2s; }
  input:focus { border-color: var(--accent); }
  .count { text-align: right; font-size: 12px; color: #94a3b8; margin: 6px 2px 16px; }
  button { width: 100%; font: inherit; font-size: 18px; font-weight: 700; padding: 15px; border: 0; border-radius: 12px;
    background: var(--accent); color: #111; cursor: pointer; transition: transform .1s, opacity .2s; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .55; }
  .err { color: #fca5a5; font-size: 14px; min-height: 20px; margin-top: 10px; }
  .done { text-align: center; display: none; }
  .done .big { font-size: 64px; margin-bottom: 8px; animation: pop .6s cubic-bezier(.2,.9,.2,1.3) both; }
  .done h2 { font-size: 22px; line-height: 1.4; margin: 0 0 18px; }
  .link { background: none; color: #cbd5e1; font-size: 15px; font-weight: 500; text-decoration: underline; padding: 8px; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<main class="card">
  <form id="form" autocomplete="off">
    <p class="tag" id="tag"></p>
    <h1 id="title">Check-in</h1>
    <p class="sub" id="sub"></p>
    <input id="name" name="name" type="text" required autocomplete="name" enterkeyhint="send">
    <div class="count" id="count"></div>
    <button id="btn" type="submit">Gửi</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <div class="done" id="done">
    <div class="big">🎉</div>
    <h2 id="thanks"></h2>
    <button class="link" id="again" type="button">Gửi tên khác</button>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let cfg = { maxNameLength: 40, formThanks: 'Cảm ơn {name}!' };

fetch('/api/form').then((r) => r.json()).then((c) => {
  cfg = c;
  $('tag').textContent = c.headline || '';
  $('title').textContent = c.formTitle; document.title = c.formTitle;
  $('sub').textContent = c.formSubtitle;
  $('name').placeholder = c.formPlaceholder;
  $('name').maxLength = c.maxNameLength;
  $('btn').textContent = c.formButton;
  document.documentElement.style.setProperty('--accent', c.accentColor);
  if (c.fontFamily) {
    document.documentElement.style.setProperty('--font', `'${c.fontFamily}'`);
    $('fontLink').href = 'https://fonts.googleapis.com/css2?family=' + c.fontFamily.replace(/ /g, '+') + ':wght@400;600;700&display=swap';
  }
  updateCount();
}).catch(() => {});

function updateCount() { $('count').textContent = $('name').value.length + ' / ' + cfg.maxNameLength; }
$('name').addEventListener('input', updateCount);

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('name').value.trim();
  if (!name) { $('err').textContent = 'Vui lòng nhập họ tên'; return; }
  $('btn').disabled = true; $('err').textContent = '';
  try {
    const r = await fetch('/api/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Có lỗi, vui lòng thử lại');
    $('thanks').textContent = (cfg.formThanks || '').replaceAll('{name}', data.name);
    $('form').style.display = 'none'; $('done').style.display = 'block';
    $('name').blur();
  } catch (err) {
    $('err').textContent = err.message || 'Không kết nối được, vui lòng thử lại';
  } finally { $('btn').disabled = false; }
});

$('again').onclick = () => { $('name').value = ''; updateCount(); $('done').style.display = 'none'; $('form').style.display = 'block'; $('name').focus(); };
</script>
</body>
</html>
